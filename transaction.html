<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>收支記帳 - SmartBook</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            💰 收支記帳
        </h2>

        <a
            href="index.html"
            class="btn btn-secondary"
        >
            ← 返回首頁
        </a>

    </div>

    <div class="card p-4">

        <!-- 日期 -->
        <div class="mb-3">

            <label
                for="date"
                class="form-label"
            >
                日期
            </label>

            <input
                type="date"
                class="form-control"
                id="date"
            >

        </div>

        <!-- 類型 -->
        <div class="mb-3">

            <label
                for="type"
                class="form-label"
            >
                類型
            </label>

            <select
                class="form-select"
                id="type"
            >
                <option value="收入">收入</option>
                <option value="支出">支出</option>
                <option value="代墊">代墊</option>
            </select>

        </div>

        <!-- 分類 -->
        <div class="mb-3">

            <label
                for="category"
                class="form-label"
            >
                分類
            </label>

            <select
                class="form-select"
                id="category"
            >
                <option value="薪資">薪資</option>
                <option value="獎金">獎金</option>
                <option value="投資">投資</option>
                <option value="餐飲">餐飲</option>
                <option value="交通">交通</option>
                <option value="購物">購物</option>
                <option value="娛樂">娛樂</option>
                <option value="醫療">醫療</option>
                <option value="其他">其他</option>
            </select>

        </div>

        <!-- 代墊對象 -->
        <div class="mb-3">

            <label
                for="advancePerson"
                class="form-label"
            >
                代墊對象
            </label>

            <input
                type="text"
                class="form-control"
                id="advancePerson"
                placeholder="例如：小明、公司、媽媽"
            >

        </div>

        <!-- 代墊狀態 -->
        <div class="mb-3">

            <label
                for="advanceStatus"
                class="form-label"
            >
                代墊狀態
            </label>

            <select
                class="form-select"
                id="advanceStatus"
            >
                <option value="未收回">未收回</option>
                <option value="已收回">已收回</option>
            </select>

        </div>

        <!-- 收回日期 -->
        <div class="mb-3">

            <label
                for="recoveredDate"
                class="form-label"
            >
                收回日期
            </label>

            <input
                type="date"
                class="form-control"
                id="recoveredDate"
            >

        </div>

        <!-- 項目 -->
        <div class="mb-3">

            <label
                for="item"
                class="form-label"
            >
                項目
            </label>

            <input
                type="text"
                class="form-control"
                id="item"
                placeholder="例如：薪水、午餐"
            >

        </div>

        <!-- 金額 -->
        <div class="mb-3">

            <label
                for="amount"
                class="form-label"
            >
                金額
            </label>

            <input
                type="number"
                class="form-control"
                id="amount"
                min="1"
                step="1"
                placeholder="例如：120"
            >

        </div>

        <!-- 備註 -->
        <div class="mb-3">

            <label
                for="note"
                class="form-label"
            >
                備註
            </label>

            <textarea
                class="form-control"
                id="note"
                rows="3"
                placeholder="可輸入補充說明"
            ></textarea>

        </div>

        <!-- 新增／儲存按鈕 -->
        <button
            type="button"
            class="btn btn-primary"
            id="addBtn"
        >
            新增交易
        </button>

        <hr class="my-4">

        <!-- 搜尋與篩選 -->
        <div class="card p-3 mb-4">

            <h4 class="mb-3">
                🔍 搜尋與篩選
            </h4>

            <div class="row g-3">

                <!-- 關鍵字 -->
                <div class="col-md-4">

                    <label
                        for="searchKeyword"
                        class="form-label"
                    >
                        關鍵字
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="searchKeyword"
                        placeholder="搜尋項目、備註、代墊對象或分類"
                    >

                </div>

                <!-- 類型 -->
                <div class="col-md-2">

                    <label
                        for="filterType"
                        class="form-label"
                    >
                        類型
                    </label>

                    <select
                        class="form-select"
                        id="filterType"
                    >
                        <option value="">全部</option>
                        <option value="收入">收入</option>
                        <option value="支出">支出</option>
                        <option value="代墊">代墊</option>
                    </select>

                </div>

                <!-- 分類 -->
                <div class="col-md-2">

                    <label
                        for="filterCategory"
                        class="form-label"
                    >
                        分類
                    </label>

                    <select
                        class="form-select"
                        id="filterCategory"
                    >
                        <option value="">全部</option>
                        <option value="薪資">薪資</option>
                        <option value="獎金">獎金</option>
                        <option value="投資">投資</option>
                        <option value="餐飲">餐飲</option>
                        <option value="交通">交通</option>
                        <option value="購物">購物</option>
                        <option value="娛樂">娛樂</option>
                        <option value="醫療">醫療</option>
                        <option value="其他">其他</option>
                    </select>

                </div>

                <!-- 開始日期 -->
                <div class="col-md-2">

                    <label
                        for="filterStartDate"
                        class="form-label"
                    >
                        開始日期
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="filterStartDate"
                    >

                </div>

                <!-- 結束日期 -->
                <div class="col-md-2">

                    <label
                        for="filterEndDate"
                        class="form-label"
                    >
                        結束日期
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="filterEndDate"
                    >

                </div>

            </div>

            <div class="mt-3">

                <button
                    type="button"
                    class="btn btn-primary me-2"
                    id="searchBtn"
                >
                    🔍 搜尋
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="clearSearchBtn"
                >
                    清除篩選
                </button>

            </div>

        </div>

        <!-- 交易紀錄 -->
        <h4 class="mb-3">
            交易紀錄
        </h4>

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead>

                    <tr>
                        <th>日期</th>
                        <th>類型</th>
                        <th>分類</th>
                        <th>代墊對象</th>
                        <th>代墊狀態</th>
                        <th>收回日期</th>
                        <th>項目</th>
                        <th>金額</th>
                        <th>備註</th>
                        <th width="120">操作</th>
                    </tr>

                </thead>

                <tbody id="transactionList">
                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- 分類管理模組要先載入 -->
<script src="js/category.js"></script>

<!-- SmartBook 核心程式 -->
<script src="js/app.js"></script>

</body>

</html>
