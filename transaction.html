<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>收支記帳 - SmartBook</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SmartBook CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- 手機版 -->
    <link
        rel="stylesheet"
        href="css/mobile.css"
    >

</head>


<body>


<div class="container mt-5 mb-5">


    <!-- ===============================
         頂部
         =============================== -->

    <div
        class="
            d-flex
            justify-content-between
            align-items-center
            flex-wrap
            gap-2
            mb-4
        "
    >

        <div class="d-flex align-items-center gap-3 flex-wrap">

    <h2 class="mb-0">
        💰 收支記帳
    </h2>

    <!-- SmartBook 雲端同步狀態 -->
    <div class="smartbook-sync-wrap">

        <span
            id="syncStatus"
            class="smartbook-sync-status"
        >
            ☁️ 已同步
        </span>

        <small id="lastSyncTime">
            尚未同步
        </small>

    </div>

</div>


<div class="d-flex gap-2 flex-wrap">

    <!-- 直接跳到交易紀錄 -->
    <a
        href="#transactionRecords"
        class="btn btn-primary"
    >
        📋 查看交易紀錄
    </a>

    <a
        href="index.html"
        class="btn btn-secondary"
    >
        ← 返回首頁
    </a>

</div>
    </div>

    <!-- =====================================
     V7.4 新版新增交易入口
     ===================================== -->

<div class="card p-4 mb-4">

    <div
        class="
            d-flex
            justify-content-between
            align-items-center
            flex-wrap
            gap-3
        "
    >

        <div>

            <h4 class="mb-1">
                ＋ 新增交易
            </h4>

            <p class="text-muted mb-0">
                新增支出、收入、代墊、應收款或轉帳。
            </p>

        </div>

        <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#quickTransactionModal"
        >
            ＋ 新增交易
        </button>

    </div>

</div>


    <!-- ===============================
         搜尋 / 篩選
         預設收合
         =============================== -->

    <details class="card p-3 mb-4">

        <summary
            class="fw-bold"
            style="cursor: pointer;"
        >
            🔍 搜尋與篩選
        </summary>


        <div class="mt-4">


            <div class="row g-3">


                <!-- 關鍵字 -->

                <div class="col-md-4">

                    <label
                        for="searchKeyword"
                        class="form-label"
                    >
                        關鍵字
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="searchKeyword"
                        placeholder="搜尋項目、備註、代墊對象或分類"
                    >

                </div>



                <!-- 類型 -->

                <div class="col-md-2">

                    <label
                        for="filterType"
                        class="form-label"
                    >
                        類型
                    </label>

                    <select
                        class="form-select"
                        id="filterType"
                    >

                        <option value="">
                            全部
                        </option>

                        <option value="收入">
                            收入
                        </option>

                        <option value="支出">
                            支出
                        </option>

                        <option value="代墊">
                            代墊
                        </option>

                    </select>

                </div>



                <!-- 分類 -->

                <div class="col-md-2">

                    <label
                        for="filterCategory"
                        class="form-label"
                    >
                        分類
                    </label>

                    <select
                        class="form-select"
                        id="filterCategory"
                    >

                        <option value="">
                            全部
                        </option>

                        <option value="薪資">
                            薪資
                        </option>

                        <option value="獎金">
                            獎金
                        </option>

                        <option value="投資">
                            投資
                        </option>

                        <option value="餐飲">
                            餐飲
                        </option>

                        <option value="交通">
                            交通
                        </option>

                        <option value="購物">
                            購物
                        </option>

                        <option value="娛樂">
                            娛樂
                        </option>

                        <option value="醫療">
                            醫療
                        </option>

                        <option value="其他">
                            其他
                        </option>

                    </select>

                </div>



                <!-- 開始日期 -->

                <div class="col-md-2">

                    <label
                        for="filterStartDate"
                        class="form-label"
                    >
                        開始日期
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="filterStartDate"
                    >

                </div>



                <!-- 結束日期 -->

                <div class="col-md-2">

                    <label
                        for="filterEndDate"
                        class="form-label"
                    >
                        結束日期
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="filterEndDate"
                    >

                </div>


            </div>



            <div class="mt-3">

                <button
                    type="button"
                    class="btn btn-primary me-2"
                    id="searchBtn"
                >
                    🔍 搜尋
                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="clearSearchBtn"
                >
                    清除篩選
                </button>

            </div>


        </div>


    </details>



    <!-- ===============================
         交易紀錄
         =============================== -->

    <div
        id="transactionRecords"
        class="card p-3"
        style="scroll-margin-top: 20px;"
    >


        <div
            class="
                d-flex
                justify-content-between
                align-items-center
                flex-wrap
                gap-2
                mb-3
            "
        >

            <h4 class="mb-0">
                📋 交易紀錄
            </h4>


            <a
                href="#top"
                class="btn btn-outline-secondary btn-sm"
                onclick="window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                }); return false;"
            >
                ↑ 回到上方
            </a>

        </div>



        <div class="table-responsive">

            <table
                class="
                    table
                    table-bordered
                    table-hover
                    align-middle
                "
            >

                <thead>

                    <tr>

                        <th>日期</th>

                        <th>類型</th>

                        <th>分類</th>

                        <th>代墊對象</th>

                        <th>代墊狀態</th>

                        <th>收回日期</th>

                        <th>項目</th>

                        <th>金額</th>

                        <th>備註</th>

                        <th width="120">
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody id="transactionList">
                </tbody>


            </table>

        </div>


    </div>


</div>

<!-- =====================================
     V7.4 新增交易 Modal
     ===================================== -->

<div
    class="modal fade"
    id="quickTransactionModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div
        class="
            modal-dialog
            modal-dialog-centered
            modal-lg
        "
    >

        <div class="modal-content">

            <!-- 標題 -->
            <div class="modal-header">

                <div>

                    <small class="text-muted">
                        TRANSACTION
                    </small>

                    <h4 class="modal-title">
                        新增交易
                    </h4>

                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="關閉"
                ></button>

            </div>


            <div class="modal-body">

                <!-- ===============================
                     交易類型
                     =============================== -->

                <label class="form-label">
                    交易類型
                </label>

                <div
                    class="btn-group w-100 mb-4"
                    role="group"
                >

                    <button
                        type="button"
                        class="btn btn-outline-primary quick-type-btn active"
                        data-type="支出"
                    >
                        支出
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary quick-type-btn"
                        data-type="收入"
                    >
                        收入
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary quick-type-btn"
                        data-type="代墊"
                    >
                        代墊
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary quick-type-btn"
                        data-type="應收款"
                    >
                        應收款
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary quick-type-btn"
                        data-type="轉帳"
                    >
                        轉帳
                    </button>

                </div>


                <!-- 真正給 JS 使用的類型 -->
                <input
                    type="hidden"
                    id="quickType"
                    value="支出"
                >


                <div class="row g-3">

                    <!-- 項目 -->
                    <div
                        class="col-12"
                        id="quickItemGroup"
                    >

                        <label
                            for="quickItem"
                            class="form-label"
                        >
                            項目名稱
                        </label>

                        <input
                            type="text"
                            id="quickItem"
                            class="form-control"
                            placeholder="例如：午餐"
                        >

                    </div>


                    <!-- 分類 -->
                    <div
                        class="col-md-6"
                        id="quickCategoryGroup"
                    >

                        <label
                            for="quickCategory"
                            class="form-label"
                        >
                            分類
                        </label>

                        <select
                            id="quickCategory"
                            class="form-select"
                        ></select>

                    </div>


                    <!-- 金額 -->
                    <div class="col-md-6">

                        <label
                            for="quickAmount"
                            class="form-label"
                        >
                            金額
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                NT$
                            </span>

                            <input
                                type="number"
                                id="quickAmount"
                                class="form-control"
                                min="1"
                                step="1"
                                placeholder="0"
                            >

                        </div>

                    </div>


                    <!-- 日期 -->
                    <div class="col-md-6">

                        <label
                            for="quickDate"
                            class="form-label"
                        >
                            日期
                        </label>

                        <input
                            type="date"
                            id="quickDate"
                            class="form-control"
                        >

                    </div>


                    <!-- 帳戶 -->
                    <div
                        class="col-md-6"
                        id="quickAccountGroup"
                    >

                        <label
                            for="quickAccount"
                            class="form-label"
                        >
                            帳戶
                        </label>

                        <select
                            id="quickAccount"
                            class="form-select"
                        >

                            <option value="現金">
                                現金
                            </option>

                            <option value="銀行">
                                銀行
                            </option>

                            <option value="信用卡">
                                信用卡
                            </option>

                        </select>

                    </div>


                    <!-- 代墊對象 -->
                    <div
                        class="col-md-6 d-none"
                        id="quickAdvancePersonGroup"
                    >

                        <label
                            for="quickAdvancePerson"
                            class="form-label"
                        >
                            代墊對象
                        </label>

                        <input
                            type="text"
                            id="quickAdvancePerson"
                            class="form-control"
                            placeholder="例如：小明"
                        >

                    </div>


                    <!-- 應收款對象 -->
                    <div
                        class="col-md-6 d-none"
                        id="quickReceivablePersonGroup"
                    >

                        <label
                            for="quickReceivablePerson"
                            class="form-label"
                        >
                            客戶／欠款人
                        </label>

                        <input
                            type="text"
                            id="quickReceivablePerson"
                            class="form-control"
                            placeholder="輸入姓名"
                        >

                    </div>


                    <!-- 預計收款日 -->
                    <div
                        class="col-md-6 d-none"
                        id="quickExpectedReceiveDateGroup"
                    >

                        <label
                            for="quickExpectedReceiveDate"
                            class="form-label"
                        >
                            預計收款日
                        </label>

                        <input
                            type="date"
                            id="quickExpectedReceiveDate"
                            class="form-control"
                        >

                    </div>


                    <!-- 轉出帳戶 -->
                    <div
                        class="col-md-6 d-none"
                        id="quickFromAccountGroup"
                    >

                        <label
                            for="quickFromAccount"
                            class="form-label"
                        >
                            轉出帳戶
                        </label>

                        <select
                            id="quickFromAccount"
                            class="form-select"
                        >

                            <option value="現金">
                                現金
                            </option>

                            <option value="銀行">
                                銀行
                            </option>

                            <option value="信用卡">
                                信用卡
                            </option>

                        </select>

                    </div>


                    <!-- 轉入帳戶 -->
                    <div
                        class="col-md-6 d-none"
                        id="quickToAccountGroup"
                    >

                        <label
                            for="quickToAccount"
                            class="form-label"
                        >
                            轉入帳戶
                        </label>

                        <select
                            id="quickToAccount"
                            class="form-select"
                        >

                            <option value="現金">
                                現金
                            </option>

                            <option value="銀行">
                                銀行
                            </option>

                            <option value="信用卡">
                                信用卡
                            </option>

                        </select>

                    </div>


                    <!-- 備註 -->
                    <div class="col-12">

                        <label
                            for="quickNote"
                            class="form-label"
                        >
                            備註
                        </label>

                        <textarea
                            id="quickNote"
                            class="form-control"
                            rows="3"
                            placeholder="選填"
                        ></textarea>

                    </div>

                </div>


                <div
                    id="quickEntryMessage"
                    class="mt-3"
                    style="display: none;"
                ></div>

            </div>


            <!-- 底部按鈕 -->
            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal"
                >
                    取消
                </button>


                <button
                    type="button"
                    id="quickSaveAndContinueBtn"
                    class="btn btn-outline-primary"
                >
                    儲存並繼續新增
                </button>


                <button
                    type="button"
                    id="quickAddBtn"
                    class="btn btn-primary"
                >
                    儲存交易
                </button>

            </div>

        </div>

    </div>

</div>



<!-- =====================================
     JavaScript
     ===================================== -->


<!-- Firebase -->
<script
    type="module"
    src="js/firebase.js">
</script>


<!-- Storage 模組 -->
<script src="js/storage.js"></script>


<!-- 共用工具 -->
<script src="js/utils.js"></script>


<!-- 分類管理 -->
<script src="js/category.js"></script>


<!-- 交易模組 -->
<script src="js/transaction.js"></script>


<!-- SmartBook 核心程式 -->
<script src="js/app.js"></script>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- V7.4 共用新增交易 -->
<script src="js/quick-entry.js"></script>


</body>

</html>
