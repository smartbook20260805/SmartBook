<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收支記帳 - SmartBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">💰 收支記帳</h2>

    <div class="card p-4">

        <div class="mb-3">
            <label class="form-label">日期</label>
            <input type="date" class="form-control" id="date">
        </div>

        <div class="mb-3">
            <label class="form-label">類型</label>
            <select class="form-select" id="type">

               <option>收入</option>
               <option>支出</option>
               <option>代墊</option>

</select>
        </div>

        <div class="mb-3">
    <label class="form-label">代墊狀態</label>

    <select class="form-select" id="advanceStatus">
        <option value="未收回">未收回</option>
        <option value="已收回">已收回</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label">收回日期</label>

    <input
        type="date"
        class="form-control"
        id="recoveredDate">
</div>

        <div class="mb-3">
            <label class="form-label">項目</label>
            <div class="mb-3">
    <label class="form-label">分類</label>

    <select class="form-select" id="category">

        <option>薪資</option>
        <option>獎金</option>
        <option>投資</option>

        <option>餐飲</option>
        <option>交通</option>
        <option>購物</option>
        <option>娛樂</option>
        <option>醫療</option>

        <option>其他</option>

    </select>

</div>

     <div class="mb-3">

    <label class="form-label">
        代墊對象
    </label>

    <input
        type="text"
        class="form-control"
        id="advancePerson"
        placeholder="例如：小明、公司、媽媽">

</div>
            <input
                type="text"
                class="form-control"
                id="item"
                placeholder="例如：薪水、午餐">
        </div>

        <div class="mb-3">
            <label class="form-label">金額</label>
            <input
                type="number"
                class="form-control"
                id="amount">
        </div>

        <div class="mb-3">
            <label class="form-label">備註</label>
            <textarea
                class="form-control"
                id="note"></textarea>
        </div>

        <button
            class="btn btn-primary"
            id="addBtn">
            新增交易
        </button>

        <hr>

        <hr class="my-4">

<div class="card p-3 mb-4">

    <h4 class="mb-3">🔍 搜尋與篩選</h4>

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">關鍵字</label>

            <input
                type="text"
                class="form-control"
                id="searchKeyword"
                placeholder="搜尋項目、備註或代墊對象">
        </div>

        <div class="col-md-2">
            <label class="form-label">類型</label>

            <select class="form-select" id="filterType">
                <option value="">全部</option>
                <option value="收入">收入</option>
                <option value="支出">支出</option>
                <option value="代墊">代墊</option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">分類</label>

            <select class="form-select" id="filterCategory">
                <option value="">全部</option>
                <option value="薪資">薪資</option>
                <option value="獎金">獎金</option>
                <option value="投資">投資</option>
                <option value="餐飲">餐飲</option>
                <option value="交通">交通</option>
                <option value="購物">購物</option>
                <option value="娛樂">娛樂</option>
                <option value="醫療">醫療</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">開始日期</label>

            <input
                type="date"
                class="form-control"
                id="filterStartDate">
        </div>

        <div class="col-md-2">
            <label class="form-label">結束日期</label>

            <input
                type="date"
                class="form-control"
                id="filterEndDate">
        </div>

    </div>

    <div class="mt-3">

        <button
            type="button"
            class="btn btn-primary me-2"
            id="searchBtn">
            🔍 搜尋
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            id="clearSearchBtn">
            清除篩選
        </button>

    </div>

</div>

        <h4>交易紀錄</h4>

        <table class="table table-bordered table-hover">

            <thead>
                <tr>
                     <th>日期</th>
                     <th>類型</th>
                     <th>分類</th>
                     <th>代墊對象</th>
                     <th>代墊狀態</th>
                     <th>收回日期</th>
                     <th>項目</th>
                     <th>金額</th>
                     <th>備註</th>
                    <th width="120">操作</th>
                 </tr>
            </thead>

            <tbody id="transactionList">

            </tbody>

        </table>

    </div>

    <div class="mt-4">

        <a
            href="index.html"
            class="btn btn-secondary">

            ← 返回首頁

        </a>

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
