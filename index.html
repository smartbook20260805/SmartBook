<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBook 智慧記帳</title>
    <link rel="icon" href="favicon.ico">
    
    <!-- Bootstrap -->
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- 自訂CSS -->
   <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


    <!-- 左側選單 -->
    <aside class="sidebar">

        <h2 class="logo">
            📘 SmartBook
        </h2>


        <ul class="menu">

            <li>
                🏠 首頁
            </li>

            <li>
<a href="transaction.html">💰 收支記帳</a>
            </li>

            <li>
                🧾 代墊管理
            </li>

            <li>
               <a href="report.html">
                   📊 報表分析
               </a>
            </li>

            <li>
                ⚙️ 系統設定
            </li>

        </ul>


    </aside>





    <!-- 右側內容 -->

    <main class="content">


        <!-- 上方標題 -->

        <header class="topbar">

            <h3>
                Dashboard
            </h3>


        </header>



        <!-- Dashboard內容 -->


        <section class="dashboard">


            <div class="card-box">

                <h5>
                    💰 收入
                </h5>

                <p id="incomeTotal">
                    NT$ 0
                 </p>

            </div>




            <div class="card-box">

                <h5>
                    💸 支出
                </h5>

                <p id="expenseTotal">
                    NT$ 0
                 </p>

            </div>




            <div class="card-box">

                <h5>
                    🧾 代墊
                </h5>

               <p id="advanceTotal">
                    NT$ 0
                </p>

            </div>




            <div class="card-box">

                <h5>
                    💵 餘額
                </h5>

                <p>
                    NT$ 0
                 <p id="balanceTotal">NT$ 0</p>

            </div>



        </section>




        <section class="transaction">

            <h4>最近交易</h4>

            <div id="recentTransactions">
                 <p>尚無資料</p>
             </div>

        </section>

        <section class="transaction mt-4">

            <h4>每人尚未收回代墊</h4>

            <div id="advanceSummary">
                <p>尚無未收回代墊</p>
            </div>

</section>



    </main>


</div>



<script src="js/app.js"></script>

</body>

</html>
