<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartBook 智慧記帳</title>

    <link rel="icon" href="favicon.ico">

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SmartBook CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<div class="app">

    <!-- 側邊選單 -->
    <aside class="sidebar">

        <div class="sidebar-header">

            <h2 class="logo">
                📘 SmartBook
            </h2>

            <p class="sidebar-subtitle">
                智慧記帳系統
            </p>

        </div>

        <nav>

            <ul class="menu">

                <li class="active">
                    <a href="index.html">
                        🏠 首頁
                    </a>
                </li>

                <li>
                    <a href="transaction.html">
                        💰 收支記帳
                    </a>
                </li>

                <li>
                    <a href="transaction.html">
                        🧾 代墊管理
                    </a>
                </li>

                <li>
                    <a href="report.html">
                        📊 報表分析
                    </a>
                </li>

                <li>
                    <a href="setting.html">
                        ⚙️ 系統設定
                    </a>
                </li>

            </ul>

        </nav>

    </aside>

    <!-- 主要內容 -->
    <main class="content">

        <!-- 頂部標題 -->
        <header class="topbar">

            <div>

                <p class="page-label">
                    SMARTBOOK
                </p>

                <h1>
                    財務總覽
                </h1>

                <p class="page-description">
                    查看目前的收支、代墊、餘額與預算狀況
                </p>

            </div>

            <a
                href="transaction.html"
                class="btn btn-primary"
            >
                ＋ 新增交易
            </a>

        </header>

        <!-- Dashboard 統計卡 -->
        <section class="dashboard">

            <!-- 收入 -->
            <article class="card-box summary-card income-card">

                <div class="card-icon">
                    💰
                </div>

                <div>

                    <h5>
                        收入
                    </h5>

                    <p id="incomeTotal">
                        NT$ 0
                    </p>

                    <small>
                        所有收入總額
                    </small>

                </div>

            </article>

            <!-- 支出 -->
            <article class="card-box summary-card expense-card">

                <div class="card-icon">
                    💸
                </div>

                <div>

                    <h5>
                        支出
                    </h5>

                    <p id="expenseTotal">
                        NT$ 0
                    </p>

                    <small>
                        所有支出總額
                    </small>

                </div>

            </article>

            <!-- 代墊 -->
            <article class="card-box summary-card advance-card">

                <div class="card-icon">
                    🧾
                </div>

                <div>

                    <h5>
                        未收回代墊
                    </h5>

                    <p id="advanceTotal">
                        NT$ 0
                    </p>

                    <small>
                        目前尚未收回
                    </small>

                </div>

            </article>

            <!-- 餘額 -->
            <article class="card-box summary-card balance-card">

                <div class="card-icon">
                    💵
                </div>

                <div>

                    <h5>
                        目前餘額
                    </h5>

                    <p id="balanceTotal">
                        NT$ 0
                    </p>

                    <small>
                        收入扣除支出與代墊
                    </small>

                </div>

            </article>

            <!-- 本月預算 -->
            <article class="card-box summary-card budget-card">

                <div class="card-icon">
                    📊
                </div>

                <div class="budget-card-content">

                    <h5>
                        本月預算
                    </h5>

                    <div id="budgetStatus">

                       尚未設定

                    </div>

                <div
                         class="progress mt-3"
                        style="height:12px;">

                <div
                         id="budgetProgress"

                         class="progress-bar bg-success"

                        role="progressbar"

                         style="width:0%;">

                </div>

            </div>

                    <small>
                        本月預算使用狀況
                    </small>

                </div>

            </article>

        </section>

        <!-- 首頁資訊區 -->
        <section class="dashboard-sections">

            <!-- 最近交易 -->
            <section class="transaction dashboard-panel">

                <div class="panel-header">

                    <div>

                        <p class="panel-label">
                            RECENT
                        </p>

                        <h4>
                            最近交易
                        </h4>

                    </div>

                    <a
                        href="transaction.html"
                        class="panel-link"
                    >
                        查看全部 →
                    </a>

                </div>

                <div id="recentTransactions">

                    <p class="empty-message">
                        尚無交易資料
                    </p>

                </div>

            </section>

            <!-- 每人尚未收回代墊 -->
            <section class="transaction dashboard-panel">

                <div class="panel-header">

                    <div>

                        <p class="panel-label">
                            ADVANCES
                        </p>

                        <h4>
                            每人尚未收回代墊
                        </h4>

                    </div>

                </div>

                <div id="advanceSummary">

                    <p class="empty-message">
                        尚無未收回代墊
                    </p>

                </div>

            </section>

        </section>

    </main>

</div>

<!-- 核心程式 -->
<script src="js/app.js"></script>

<!-- 預算模組 -->
<script src="js/budget.js"></script>

</body>

</html>
