<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBook - 系統設定</title>

    <link rel="icon" href="favicon.ico">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- 左側選單 -->
    <aside class="sidebar">

        <h2 class="logo">📘 SmartBook</h2>

        <ul class="menu">

            <li><a href="index.html">🏠 首頁</a></li>

            <li><a href="transaction.html">💰 收支記帳</a></li>

            <li><a href="report.html">📊 報表分析</a></li>

            <li class="active">
                <a href="setting.html">⚙️ 系統設定</a>
            </li>

        </ul>

    </aside>

    <!-- 右側 -->
    <main class="content">

        <header class="topbar">

            <div>

                <h1>⚙️ 系統設定</h1>

                <p class="page-description">
                    SmartBook 系統功能與資料管理
                </p>

            </div>

        </header>

        <section class="dashboard">

            <div class="card-box">

                <h4>📤 資料備份</h4>

                <p>匯出所有記帳資料成 JSON 檔。</p>

                <button
                    id="backupBtn"
                    class="btn btn-primary">

                    匯出備份

                </button>

            </div>

            <div class="card-box">

                <h4>📥 資料還原</h4>

                <p>從 JSON 檔恢復所有資料。</p>

                <input
                    type="file"
                    id="restoreFile"
                    class="form-control mb-3"
                    accept=".json">

                <button
                    id="restoreBtn"
                    class="btn btn-success">

                    匯入備份

                </button>

            </div>

            <div class="card-box">

                <h4>ℹ️ SmartBook</h4>

                <p>版本：V4.1</p>

                <p>作者：lin chun</p>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>
<script src="js/setting.js"></script>

</body>

</html>
