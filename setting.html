<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBook - 系統設定</title>

    <link rel="icon" href="favicon.ico">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- 左側選單 -->
    <aside class="sidebar">

        <h2 class="logo">📘 SmartBook</h2>

        <ul class="menu">

            <li><a href="index.html">🏠 首頁</a></li>

            <li><a href="transaction.html">💰 收支記帳</a></li>

            <li><a href="report.html">📊 報表分析</a></li>

            <li class="active">
                <a href="setting.html">⚙️ 系統設定</a>
            </li>

        </ul>

    </aside>

    <!-- 右側 -->
    <main class="content">

        <header class="topbar">

            <div>

                <h1>⚙️ 系統設定</h1>

                <p class="page-description">
                    SmartBook 系統功能與資料管理
                </p>

            </div>

        </header>

        <section class="dashboard">

            <div class="card-box">

                <h4>📤 資料備份</h4>

                <p>匯出所有記帳資料成 JSON 檔。</p>

                <button
                    id="backupBtn"
                    class="btn btn-primary">

                    匯出備份

                </button>

            </div>

            <div class="card-box">

                <h4>📥 資料還原</h4>

                <p>從 JSON 檔恢復所有資料。</p>

                <input
                    type="file"
                    id="restoreFile"
                    class="form-control mb-3"
                    accept=".json">

                <button
                    id="restoreBtn"
                    class="btn btn-success">

                    匯入備份

                </button>

            </div>
            <div class="card-box">

    <h4>💰 每月預算</h4>

    <p>
        設定每個月可使用的支出預算。
    </p>

    <label
        for="monthlyBudget"
        class="form-label">
        預算金額
    </label>

    <input
        type="number"
        id="monthlyBudget"
        class="form-control mb-3"
        min="0"
        step="1"
        placeholder="例如：30000">

    <button
        type="button"
        id="saveBudgetBtn"
        class="btn btn-primary">

        儲存預算

    </button>

    <p
        id="budgetSavedMessage"
        class="text-success mt-3 mb-0"
        style="display: none;">

        ✅ 預算已儲存

    </p>

</div>

<div class="card-box">

    <h4>📂 分類管理</h4>

    <p>
        新增、修改或刪除 SmartBook 使用的交易分類。
    </p>

    <div class="input-group mb-3">

        <input
            type="text"
            id="newCategoryInput"
            class="form-control"
            placeholder="例如：房租、旅遊、股票"
        >

        <button
            type="button"
            id="addCategoryBtn"
            class="btn btn-primary"
        >
            ＋ 新增分類
        </button>

    </div>

    <div id="categoryMessage"></div>

    <div id="categoryList">

        <p class="text-muted mb-0">
            尚無分類資料
        </p>

    </div>

</div>
            <div class="card-box">

                <h4>ℹ️ SmartBook</h4>

                <p>版本：V4.1</p>

                <p>作者：lin chun</p>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>
<script src="js/setting.js"></script>
<script src="js/budget.js"></script>
<script src="js/category.js"></script>

</body>

</html>
