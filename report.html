<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>報表分析 - SmartBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container mt-5">

    <div
    class="
        d-flex
        justify-content-between
        align-items-center
        flex-wrap
        gap-3
        mb-4
    "
>

    <!-- 左側：標題 + 同步狀態 -->
    <div class="d-flex align-items-center gap-3 flex-wrap">

        <h2 class="mb-0">
            📊 報表分析
        </h2>

        <div class="smartbook-sync-wrap">

            <span
                id="syncStatus"
                class="smartbook-sync-status"
            >
                ☁️ 已同步
            </span>

            <small id="lastSyncTime">
                尚未同步
            </small>

        </div>

    </div>


    <!-- 右側：匯出按鈕 -->
    <div class="d-flex gap-2 flex-wrap">

        <button
            id="exportPDF"
            class="btn btn-danger"
        >
            📕 匯出 PDF
        </button>

        <button
            id="exportExcel"
            class="btn btn-success"
        >
            📄 匯出 Excel
        </button>

    </div>

</div>

    <button
        class="btn btn-success"
        id="exportExcel">

        📄 匯出 Excel

    </button>

</div>

    <div class="row">

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h5>💰 本月收入</h5>

                <h3 id="reportIncome">
                    NT$ 0
                </h3>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h5>💸 本月支出</h5>

                <h3 id="reportExpense">
                    NT$ 0
                </h3>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h5>🧾 本月代墊</h5>

                <h3 id="reportAdvance">
                    NT$ 0
                </h3>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-3">

                <h5>💵 本月餘額</h5>

                <h3 id="reportBalance">
                    NT$ 0
                </h3>

            </div>

        </div>

    </div>

    <hr class="my-4">


<!-- =====================================
     V7.0 本月 vs 上月財務比較
     ===================================== -->

<h4 class="mb-3">
    📈 本月 vs 上月
</h4>

<div class="row mb-4">

    <!-- 支出比較 -->
    <div class="col-md-6 mb-3">

        <div class="card p-3 h-100">

            <h5>
                💸 支出比較
            </h5>

            <p class="mb-1">
                本月：
                <strong id="currentMonthExpense">
                    NT$ 0
                </strong>
            </p>

            <p class="mb-1">
                上月：
                <strong id="previousMonthExpense">
                    NT$ 0
                </strong>
            </p>

            <div
                id="expenseComparison"
                class="mt-2"
            >
                尚無比較資料
            </div>

        </div>

    </div>


    <!-- 收入比較 -->
    <div class="col-md-6 mb-3">

        <div class="card p-3 h-100">

            <h5>
                💰 收入比較
            </h5>

            <p class="mb-1">
                本月：
                <strong id="currentMonthIncome">
                    NT$ 0
                </strong>
            </p>

            <p class="mb-1">
                上月：
                <strong id="previousMonthIncome">
                    NT$ 0
                </strong>
            </p>

            <div
                id="incomeComparison"
                class="mt-2"
            >
                尚無比較資料
            </div>

        </div>

    </div>

</div>

<hr class="my-4">


<!-- 最近 6 個月財務趨勢 -->

<h4 class="mb-3">
    📈 最近 6 個月財務趨勢
</h4>

<div
    class="card p-3 mb-4"
    style="height: 420px;"
>
    <canvas id="sixMonthTrendChart"></canvas>
</div>


<h4>📊 收入 / 支出 / 代墊比較</h4>

<div class="card p-3 mb-4" style="height:400px;">
    <canvas id="summaryChart"></canvas>
</div>


<h4>📊 支出分類統計</h4>
<div class="card p-3 mb-4" style="height: 400px;">
    <canvas id="expenseChart"></canvas>
</div>
<div id="categorySummary">

    <p>尚無資料</p>

</div>

    <h4>📋 本月交易</h4>

    <div id="reportTable">

        <p>尚無資料</p>

    </div>

    <a href="index.html" class="btn btn-secondary mt-4">

        ← 返回首頁

    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Firebase 雲端模組 -->
<script
    type="module"
    src="js/firebase.js">
</script>

<!-- SmartBook 共用儲存模組 -->
<script src="js/storage.js"></script>

<!-- SmartBook 核心 -->
<script src="js/app.js"></script>

<!-- PDF 匯出 -->
<script src="js/pdf.js"></script>

</body>
</html>
